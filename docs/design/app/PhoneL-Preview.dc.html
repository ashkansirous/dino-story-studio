<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview & download on a phone landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width:844px;height:390px;overflow:auto;scrollbar-width:none;background:#FBF7F0">
<dc-import name="Preview" hint-size="844px,390px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
